version: 2
updates:
  # Maven（Javaライブラリ）の自動更新
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    reviewers:
      - "security-team"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    # セキュリティアップデートは優先的に適用
    ignore:
      # メジャーバージョンアップは手動で確認する
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types: ["version-update:semver-major"]
    groups:
      # Spring Boot関連をまとめてアップデート
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      # Spring Security関連
      spring-security:
        patterns:
          - "org.springframework.security:*"
      # テストライブラリ
      test-dependencies:
        dependency-type: "development"
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.testcontainers:*"

  # GitHub Actionsの自動更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "security-team"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Dockerイメージの自動更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "security-team"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
