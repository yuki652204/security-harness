name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ① 機密情報スキャン
  secret-scan:
    name: 機密情報スキャン（Gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaksで機密情報をスキャン
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ② セキュリティ設定スキャン
  config-scan:
    name: 設定ファイルスキャン（Trivy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TrivyでIaCの設定ミスをスキャン
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  # ③ .envファイルが含まれていないかチェック
  env-check:
    name: 機密ファイルチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .envファイルが含まれていないか確認
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q ".env"; then
            echo "❌ .envファイルがコミットされています！"
            exit 1
          else
            echo "✅ .envファイルは含まれていません"
          fi

  # ④ .env.exampleの存在確認
  template-check:
    name: テンプレートファイルチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env.exampleが存在するか確認
        run: |
          if [ -f ".env.example" ]; then
            echo "✅ .env.exampleが存在します"
          else
            echo "❌ .env.exampleがありません！"
            exit 1
          fi

  # ⑤ 依存ライブラリの脆弱性スキャン（OWASP Dependency Check）
  dependency-check:
    name: 依存関係スキャン（OWASP Dependency Check）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: OWASP Dependency Check 実行
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ github.repository }}'
          path: '.'
          format: 'HTML'
          # CVSS 7.0以上（HIGH/CRITICAL）でビルド失敗
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression .github/dependency-check-suppressions.xml
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: スキャン結果をアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30

  # ⑥ コンテナイメージの脆弱性スキャン（Trivy）
  container-scan:
    name: コンテナイメージスキャン（Trivy）
    runs-on: ubuntu-latest
    # pom.xml が存在する場合のみ実行（Mavenプロジェクトを前提）
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Dockerイメージをビルド（Dockerfileがある場合）
        id: build
        run: |
          if [ -f "Dockerfile" ]; then
            docker build -t app-image:${{ github.sha }} .
            echo "image_built=true" >> $GITHUB_OUTPUT
          else
            echo "image_built=false" >> $GITHUB_OUTPUT
            echo "Dockerfileが存在しないためスキップします"
          fi

      - name: TrivyでDockerイメージをスキャン
        if: steps.build.outputs.image_built == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Trivyでファイルシステムをスキャン（Dockerfile不在時）
        if: steps.build.outputs.image_built == 'false'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  # ⑦ Dependabot PRのセキュリティチェック自動承認
  dependabot-auto-approve:
    name: Dependabot セキュリティアップデート自動承認
    runs-on: ubuntu-latest
    # Dependabotが作成したPRにのみ実行
    if: github.actor == 'dependabot[bot]'
    needs:
      - secret-scan
      - dependency-check
      - container-scan
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Dependabot メタデータ取得
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: パッチ・マイナーアップデートを自動承認
        # メジャーアップデートは手動レビューが必要
        if: |
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: セキュリティアップデートにラベルを付与
        if: steps.dependabot-metadata.outputs.dependency-type == 'direct:production'
        run: gh pr edit "$PR_URL" --add-label "security-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
